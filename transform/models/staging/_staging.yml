version: 2

models:
  - name: stg_eia__ercot_hourly
    description: Cleaned, de-duplicated ERCOT hourly series from EIA (one row per hour and series type).
    columns:
      - name: period_utc
        description: Start of the hour, UTC.
        data_tests: [not_null]
      - name: series_type
        description: D = demand, DF = day-ahead forecast, NG = net generation.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D', 'DF', 'NG']
      - name: value_mwh
        description: Energy for the hour in megawatt-hours.

  - name: stg_weather__hourly
    description: Cleaned, de-duplicated hourly weather per city (Fahrenheit, UTC).
    columns:
      - name: period_utc
        data_tests: [not_null]
      - name: city
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dallas', 'houston', 'austin', 'san_antonio', 'midland', 'abilene', 'wichita_falls', 'tyler', 'corpus_christi']
      - name: temp_f
        data_tests: [not_null]

  - name: stg_eia__ercot_zone_hourly
    description: Cleaned, de-duplicated hourly demand per ERCOT weather zone (one row per hour and zone).
    columns:
      - name: period_utc
        data_tests: [not_null]
      - name: zone_code
        description: EIA sub-balancing-authority code for the zone.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ercot_zone_cities')
                field: zone_code
      - name: demand_mwh
        description: Zone demand for the hour, MWh.

  - name: stg_eia__ercot_fuel_hourly
    description: Cleaned, de-duplicated hourly net generation per fuel type (one row per hour and fuel).
    columns:
      - name: period_utc
        data_tests: [not_null]
      - name: fuel_code
        description: EIA fuel type code (NG, WND, SUN, COL, NUC, ...).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ercot_fuel_types')
                field: fuel_code
              config:
                severity: warn   # a new EIA code should be added to the seed, not break the build
      - name: generation_mwh
        description: Net generation for the hour, MWh (negative for batteries while charging).
