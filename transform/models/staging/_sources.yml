version: 2

sources:
  - name: raw
    description: Partitioned Parquet files written by the Python ingestion layer (src/ingestion).
    meta:
      external_location: "read_parquet('{{ var(\"raw_dir\") }}/{name}/*/*/*.parquet', hive_partitioning = true)"
    tables:
      - name: eia_ercot_hourly
        description: >
          Hourly ERCOT data from the EIA API, one row per (hour, type).
          Types: D = demand, DF = day-ahead demand forecast, NG = net generation. Values in MWh.
      - name: eia_ercot_zone_hourly
        description: Hourly demand per ERCOT weather zone from EIA (region-sub-ba-data), parent = ERCO. MWh.
      - name: eia_ercot_fuel_hourly
        description: >
          Hourly ERCOT net generation by fuel type from EIA (fuel-type-data), respondent = ERCO. MWh.
          Battery storage is negative while charging.
      - name: weather_hourly
        description: Hourly Open-Meteo weather for 9 Texas cities, one or more per ERCOT weather zone (UTC).
