# dbt unit tests: check model logic on tiny hand-written inputs (no real data needed).
unit_tests:
  - name: uri_forecast_gap_counts_only_load_shed_hours
    description: Unserved energy is forecast minus actual, floored at 0, and only inside the load-shed window.
    model: fct_uri_unserved_hourly
    overrides:
      vars:
        uri_shed_start: "2021-02-15 01:00:00"
        uri_shed_end: "2021-02-15 03:00:00"
        uri_window_start: "2021-02-15 00:00:00"
        uri_window_end: "2021-02-15 04:00:00"
    given:
      - input: ref('fct_grid_hourly')
        rows:
          - {period_utc: "2021-02-15 06:00:00+00", period_local: "2021-02-15 00:00:00", hour_local: 0, month_local: 2, demand_mwh: 60000, forecast_mwh: 61000, avg_temp_f: 10}
          - {period_utc: "2021-02-15 07:00:00+00", period_local: "2021-02-15 01:00:00", hour_local: 1, month_local: 2, demand_mwh: 45000, forecast_mwh: 70000, avg_temp_f: 9}
          - {period_utc: "2021-02-15 08:00:00+00", period_local: "2021-02-15 02:00:00", hour_local: 2, month_local: 2, demand_mwh: 72000, forecast_mwh: 70000, avg_temp_f: 9}
          - {period_utc: "2021-02-15 09:00:00+00", period_local: "2021-02-15 03:00:00", hour_local: 3, month_local: 2, demand_mwh: 40000, forecast_mwh: 69000, avg_temp_f: 8}
    expect:
      rows:
        - {period_local: "2021-02-15 00:00:00", is_load_shed: false, unserved_vs_forecast_mwh: null}
        - {period_local: "2021-02-15 01:00:00", is_load_shed: true,  unserved_vs_forecast_mwh: 25000}
        - {period_local: "2021-02-15 02:00:00", is_load_shed: true,  unserved_vs_forecast_mwh: 0}
        - {period_local: "2021-02-15 03:00:00", is_load_shed: false, unserved_vs_forecast_mwh: null}

  - name: dim_date_assigns_seasons_and_weekends
    description: Season comes from the month; Saturday and Sunday are weekends; a federal holiday is not a business day.
    model: dim_date
    given:
      - input: ref('int_grid__hourly_pivoted')
        rows:
          - {period_utc: "2024-01-06 18:00:00+00"}
          - {period_utc: "2024-01-09 18:00:00+00"}
      - input: ref('us_holidays')
        rows:
          - {holiday_date: "2024-01-08", holiday_name: Test Holiday, holiday_type: Federal, is_nerc_holiday: false}
    expect:
      rows:
        - {date_key: 20240106, season: Winter, day_name: Saturday, is_weekend: true,  is_holiday: false, is_business_day: false}
        - {date_key: 20240107, season: Winter, day_name: Sunday,   is_weekend: true,  is_holiday: false, is_business_day: false}
        - {date_key: 20240108, season: Winter, day_name: Monday,   is_weekend: false, is_holiday: true,  is_business_day: false}
        - {date_key: 20240109, season: Winter, day_name: Tuesday,  is_weekend: false, is_holiday: false, is_business_day: true}

  - name: zone_weather_averages_multi_city_zones
    description: A zone with two reference cities (South Central) gets the average of both.
    model: int_weather__zone_hourly
    given:
      - input: ref('stg_weather__hourly')
        rows:
          - {period_utc: "2024-07-01 20:00:00+00", city: austin, temp_f: 100, humidity_pct: 40}
          - {period_utc: "2024-07-01 20:00:00+00", city: san_antonio, temp_f: 96, humidity_pct: 50}
          - {period_utc: "2024-07-01 20:00:00+00", city: houston, temp_f: 94, humidity_pct: 70}
      - input: ref('ercot_zone_cities')
        rows:
          - {zone_code: SCEN, zone_label: South Central, weather_city: austin}
          - {zone_code: SCEN, zone_label: South Central, weather_city: san_antonio}
          - {zone_code: COAS, zone_label: Coast, weather_city: houston}
    expect:
      rows:
        - {zone_code: SCEN, zone_temp_f: 98, zone_humidity_pct: 45, cities_reporting: 2}
        - {zone_code: COAS, zone_temp_f: 94, zone_humidity_pct: 70, cities_reporting: 1}

  - name: fuel_shares_ignore_battery_charging
    description: An hour's shares add up to 100%; a charging battery (negative MWh) gets 0% and is not in the total.
    model: fct_fuel_hourly
    given:
      - input: ref('stg_eia__ercot_fuel_hourly')
        rows:
          - {period_utc: "2024-07-01 20:00:00+00", fuel_code: NG,  fuel_name: gas,     generation_mwh: 30000}
          - {period_utc: "2024-07-01 20:00:00+00", fuel_code: SUN, fuel_name: solar,   generation_mwh: 20000}
          - {period_utc: "2024-07-01 20:00:00+00", fuel_code: BAT, fuel_name: battery, generation_mwh: -1000}
      - input: ref('dim_fuel')
        rows:
          - {fuel_key: NG,  fuel_label: Natural gas,     fuel_group: Fossil,    is_renewable: false, is_carbon_free: false}
          - {fuel_key: SUN, fuel_label: Solar,           fuel_group: Renewable, is_renewable: true,  is_carbon_free: true}
          - {fuel_key: BAT, fuel_label: Battery storage, fuel_group: Storage,   is_renewable: false, is_carbon_free: false}
    expect:
      rows:
        - {fuel_key: NG,  generation_mwh: 30000, share_of_hour: 0.6}
        - {fuel_key: SUN, generation_mwh: 20000, share_of_hour: 0.4}
        - {fuel_key: BAT, generation_mwh: -1000, share_of_hour: 0}

  - name: zone_heat_trend_slope_and_ci
    description: >
      Demand = 1000 + 10 x temperature on 3 hot days gives a slope of exactly 10 MWh per °F with zero-width
      confidence interval; the cool day (70°F) is left out of the fit.
    model: agg_zone_heat_trend
    given:
      - input: ref('fct_zone_hourly')
        format: sql
        rows: |
          select 'NCEN' as zone_code, 'North Central' as zone_label, d::date as date_local,
                 t as zone_temp_f, 1000 + 10 * t as demand_mwh
          from (values ('2024-07-01', 80.0), ('2024-07-02', 90.0), ('2024-07-03', 100.0), ('2024-04-01', 70.0)) v(d, t),
               range(24) h
    expect:
      rows:
        - {zone_code: NCEN, year: 2024, days: 4, hot_days: 3, slope_mwh_per_f: 10, slope_se: 0, ci_low_mwh_per_f: 10, ci_high_mwh_per_f: 10}

  - name: zone_heat_change_needs_non_overlapping_intervals
    description: A change is only called when the first and latest years' 95% intervals don't overlap; unreliable years are ignored.
    model: rpt_zone_heat_change
    given:
      - input: ref('agg_zone_heat_trend')
        rows:
          - {zone_code: COAS, zone_label: Coast, year: 2021, is_reliable: true,  slope_pct_per_f: 3.0, ci_low_pct_per_f: 2.8, ci_high_pct_per_f: 3.2, slope_mwh_per_f: 600}
          - {zone_code: COAS, zone_label: Coast, year: 2025, is_reliable: true,  slope_pct_per_f: 3.6, ci_low_pct_per_f: 3.4, ci_high_pct_per_f: 3.8, slope_mwh_per_f: 760}
          - {zone_code: FWES, zone_label: Far West, year: 2021, is_reliable: true,  slope_pct_per_f: 0.4, ci_low_pct_per_f: 0.2, ci_high_pct_per_f: 0.6, slope_mwh_per_f: 30}
          - {zone_code: FWES, zone_label: Far West, year: 2025, is_reliable: true,  slope_pct_per_f: 0.3, ci_low_pct_per_f: 0.1, ci_high_pct_per_f: 0.5, slope_mwh_per_f: 25}
          - {zone_code: FWES, zone_label: Far West, year: 2026, is_reliable: false, slope_pct_per_f: 9.9, ci_low_pct_per_f: 1.0, ci_high_pct_per_f: 19.0, slope_mwh_per_f: 900}
          - {zone_code: NRTH, zone_label: North, year: 2021, is_reliable: true,  slope_pct_per_f: 2.0, ci_low_pct_per_f: 1.9, ci_high_pct_per_f: 2.1, slope_mwh_per_f: 40}
          - {zone_code: NRTH, zone_label: North, year: 2025, is_reliable: true,  slope_pct_per_f: 1.5, ci_low_pct_per_f: 1.4, ci_high_pct_per_f: 1.6, slope_mwh_per_f: 32}
    expect:
      rows:
        - {zone_code: COAS, first_year: 2021, latest_year: 2025, verdict: More heat-sensitive}
        - {zone_code: FWES, first_year: 2021, latest_year: 2025, verdict: No clear change}
        - {zone_code: NRTH, first_year: 2021, latest_year: 2025, verdict: Less heat-sensitive}

  - name: holiday_baseline_skips_other_holidays
    description: >
      Christmas is compared with the same weekday 1 and 2 weeks around it; New Year's Day (one week later)
      is a holiday too, so it is left out of the baseline.
    model: agg_holiday_effect
    given:
      - input: ref('agg_grid_daily')
        rows:
          - {date_local: "2024-12-11", avg_demand_mwh: 50000, avg_temp_f: 50, hours_with_demand: 24}
          - {date_local: "2024-12-18", avg_demand_mwh: 50000, avg_temp_f: 50, hours_with_demand: 24}
          - {date_local: "2024-12-25", avg_demand_mwh: 40000, avg_temp_f: 50, hours_with_demand: 24}
          - {date_local: "2025-01-01", avg_demand_mwh: 30000, avg_temp_f: 40, hours_with_demand: 24}
          - {date_local: "2025-01-08", avg_demand_mwh: 50000, avg_temp_f: 50, hours_with_demand: 24}
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-12-11", is_holiday: false, holiday_name: null, holiday_type: null, is_nerc_holiday: false, day_name: Wednesday}
          - {date_day: "2024-12-18", is_holiday: false, holiday_name: null, holiday_type: null, is_nerc_holiday: false, day_name: Wednesday}
          - {date_day: "2024-12-25", is_holiday: true, holiday_name: Christmas Day, holiday_type: Federal, is_nerc_holiday: true, day_name: Wednesday}
          - {date_day: "2025-01-01", is_holiday: true, holiday_name: New Year's Day, holiday_type: Federal, is_nerc_holiday: true, day_name: Wednesday}
          - {date_day: "2025-01-08", is_holiday: false, holiday_name: null, holiday_type: null, is_nerc_holiday: false, day_name: Wednesday}
    expect:
      rows:
        - {date_local: "2024-12-25", baseline_days: 3, baseline_demand_mwh: 50000, demand_change_pct: -20.0}
        - {date_local: "2025-01-01", baseline_days: 2, baseline_demand_mwh: 50000, demand_change_pct: -40.0}

  - name: forecast_accuracy_scores_only_shared_hours
    description: >
      Both forecasts are scored on the same hours: an hour missing ERCOT's forecast, or inside the
      Uri load-shed window, is left out for both.
    model: agg_forecast_accuracy_monthly
    given:
      - input: ref('fct_forecast_hourly')
        rows:
          - {date_local: "2024-07-01", hour_local: 16, actual_mwh: 100, eia_forecast_mwh: 110, model_forecast_mwh: 95,  model_abs_pct_error: 0.05, eia_abs_pct_error: 0.10, model_error_mwh: -5, eia_error_mwh: 10, is_load_shed: false}
          - {date_local: "2024-07-01", hour_local: 3,  actual_mwh: 100, eia_forecast_mwh: 99,  model_forecast_mwh: 103, model_abs_pct_error: 0.03, eia_abs_pct_error: 0.01, model_error_mwh: 3,  eia_error_mwh: -1, is_load_shed: false}
          - {date_local: "2024-07-02", hour_local: 3,  actual_mwh: 100, eia_forecast_mwh: null, model_forecast_mwh: 150, model_abs_pct_error: 0.50, eia_abs_pct_error: null, model_error_mwh: 50, eia_error_mwh: null, is_load_shed: false}
          - {date_local: "2024-07-03", hour_local: 3,  actual_mwh: 100, eia_forecast_mwh: 200, model_forecast_mwh: 200, model_abs_pct_error: 1.0, eia_abs_pct_error: 1.0, model_error_mwh: 100, eia_error_mwh: 100, is_load_shed: true}
    expect:
      rows:
        - {month: "2024-07-01", hours: 2, model_mape_pct: 4.0, eia_mape_pct: 5.5, model_peak_mape_pct: 5.0, eia_peak_mape_pct: 10.0, model_better_share: 0.5}

  - name: forecast_weather_effect_is_measured_on_the_same_hours
    description: >
      weather_effect_pts compares the model with forecast weather against the model with observed weather on
      the SAME hours (those that have a weather forecast), so missing forecasts can't skew the split.
    model: agg_forecast_accuracy_monthly
    given:
      - input: ref('fct_forecast_hourly')
        rows:
          - {date_local: "2024-07-01", hour_local: 16, actual_mwh: 100, eia_forecast_mwh: 102, model_forecast_mwh: 102, model_fw_forecast_mwh: 106, model_abs_pct_error: 0.02, eia_abs_pct_error: 0.02, model_fw_abs_pct_error: 0.06, model_error_mwh: 2, eia_error_mwh: 2, temp_forecast_error_f: 3, is_load_shed: false}
          - {date_local: "2024-07-01", hour_local: 17, actual_mwh: 100, eia_forecast_mwh: 102, model_forecast_mwh: 110, model_fw_forecast_mwh: null, model_abs_pct_error: 0.10, eia_abs_pct_error: 0.02, model_fw_abs_pct_error: null, model_error_mwh: 10, eia_error_mwh: 2, temp_forecast_error_f: null, is_load_shed: false}
    expect:
      rows:
        - {month: "2024-07-01", hours: 2, model_mape_pct: 6.0, fw_hours: 1, model_fw_mape_pct: 6.0, model_obs_mape_fw_hours_pct: 2.0, weather_effect_pts: 4.0, temp_forecast_mae_f: 3.0}
