version: 2

models:
  - name: fct_grid_hourly
    description: One row per hour — ERCOT demand, forecast and generation joined to Texas weather.
    columns:
      - name: period_utc
        description: Start of the hour, UTC (primary key).
        data_tests: [unique, not_null]
      - name: period_local
        description: Start of the hour, US Central time.
      - name: forecast_error_mwh
        description: Actual demand minus day-ahead forecast (positive = grid under-forecast).
      - name: abs_pct_error
        description: Absolute forecast error as a share of actual demand.
      - name: cooling_degree_hours
        description: max(avg Texas temp - 65°F, 0). Drives air-conditioning load.

  - name: agg_grid_daily
    description: Daily (Central time) peak demand, peak hour, weather and forecast accuracy.
    columns:
      - name: date_local
        data_tests: [unique, not_null]
      - name: peak_hour_local
        description: Local hour (0-23) when demand peaked that day.

  - name: agg_demand_by_temperature
    description: Average and peak demand per 5°F band of average Texas temperature.
    columns:
      - name: temp_band_f
        data_tests: [unique, not_null]

  - name: dq_grid_missing_hours
    description: Hours inside the covered range with no demand value (data-quality monitor).

  - name: fct_uri_unserved_hourly
    description: >
      Winter Storm Uri (Feb 8-21, 2021), hourly. Estimates demand that went unserved during ERCOT's
      rolling blackouts two ways: the day-ahead forecast gap, and a weather model (one temperature slope
      plus a baseline per hour of day, trained on other winters' cold hours).
    columns:
      - name: period_utc
        data_tests: [unique, not_null]
      - name: weather_expected_mwh
        description: Demand the weather model expects at that hour's temperature.
      - name: is_load_shed
        description: True for hours inside ERCOT's load-shed orders (Feb 15 01:00 to Feb 18 01:00 CT).
      - name: unserved_vs_forecast_mwh
        description: max(forecast - actual, 0) during load shed.
      - name: unserved_vs_weather_mwh
        description: max(weather_expected - actual, 0) during load shed.
      - name: is_extrapolated
        description: Temperature colder than any training hour; the weather estimate is less certain here.

  - name: agg_uri_summary
    description: One-row summary of estimated unserved energy (GWh) and peak shortfall during Uri.
