version: 2

models:
  - name: fct_grid_hourly
    description: One row per hour — ERCOT demand, forecast and generation joined to Texas weather.
    columns:
      - name: period_utc
        description: Start of the hour, UTC (primary key).
        data_tests: [unique, not_null]
      - name: period_local
        description: Start of the hour, US Central time.
      - name: date_key
        description: Central-time date as YYYYMMDD; joins to dim_date.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: forecast_error_mwh
        description: Actual demand minus day-ahead forecast (positive = grid under-forecast).
      - name: abs_pct_error
        description: Absolute forecast error as a share of actual demand.
      - name: cooling_degree_hours
        description: max(avg Texas temp - 65°F, 0). Drives air-conditioning load.

  - name: agg_grid_daily
    description: Daily (Central time) peak demand, peak hour, weather and forecast accuracy.
    columns:
      - name: date_local
        data_tests: [unique, not_null]
      - name: peak_hour_local
        description: Local hour (0-23) when demand peaked that day.

  - name: agg_demand_by_temperature
    description: Average and peak demand per 5°F band of average Texas temperature.
    columns:
      - name: temp_band_f
        data_tests: [unique, not_null]

  - name: dq_grid_missing_hours
    description: Hours inside the covered range with no demand value (data-quality monitor).

  - name: fct_uri_unserved_hourly
    description: >
      Winter Storm Uri (Feb 8-21, 2021), hourly. Estimates demand that went unserved during ERCOT's
      rolling blackouts two ways: the day-ahead forecast gap, and a weather model (one temperature slope
      plus a baseline per hour of day, trained on other winters' cold hours).
    columns:
      - name: period_utc
        data_tests: [unique, not_null]
      - name: weather_expected_mwh
        description: Demand the weather model expects at that hour's temperature.
      - name: is_load_shed
        description: True for hours inside ERCOT's load-shed orders (Feb 15 01:00 to Feb 18 01:00 CT).
      - name: unserved_vs_forecast_mwh
        description: max(forecast - actual, 0) during load shed.
      - name: unserved_vs_weather_mwh
        description: max(weather_expected - actual, 0) during load shed.
      - name: is_extrapolated
        description: Temperature colder than any training hour; the weather estimate is less certain here.

  - name: agg_uri_summary
    description: One-row summary of estimated unserved energy (GWh) and peak shortfall during Uri.

  - name: fct_zone_hourly
    description: One row per hour and ERCOT weather zone, with zone demand and that zone's local temperature.
    columns:
      - name: zone_code
        data_tests: [not_null]
      - name: zone_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: agg_zone_profile
    description: >
      One row per ERCOT weather zone: share of energy, peak, and temperature sensitivity
      (MWh and % of the zone's average demand per °F above 75°F).
    columns:
      - name: zone_code
        data_tests: [unique, not_null]

  - name: fct_grid_series_hourly
    description: >
      Star-schema fact at grain (hour, series) for the whole grid. Joins to dim_date, dim_zone ('ERCO')
      and dim_series.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: zone_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key
      - name: series_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_key

  - name: rpt_eia_revisions
    description: >
      One row per detected EIA revision: a day/series whose published total or hour count changed after
      we first loaded it. Built from the snp_eia_daily_totals snapshot.

  - name: fct_fuel_hourly
    description: >
      Star-schema fact at grain (hour, fuel): ERCOT net generation by fuel type and its share of that
      hour's generation. Joins to dim_date and dim_fuel.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: fuel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fuel')
                field: fuel_key
              config:
                severity: warn
      - name: share_of_hour
        description: Generation / the hour's total positive generation (battery charging excluded).

  - name: agg_fuel_monthly
    description: Monthly generation (GWh) and share by fuel type.
    columns:
      - name: month
        data_tests: [not_null]

  - name: agg_fuel_yearly
    description: Yearly renewable and carbon-free share of ERCOT generation, plus wind, solar, gas and coal shares.
    columns:
      - name: year
        data_tests: [unique, not_null]

  - name: agg_fuel_by_condition
    description: >
      Fuel shares under three grid conditions: all hours, each year's top 5% demand hours, and the
      Winter Storm Uri load-shed hours. Shows which sources carry the grid when it is stressed.
    columns:
      - name: condition
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['All hours', 'Top 5% demand hours', 'Uri load shed']
