version: 2

seeds:
  - name: ercot_zone_cities
    description: >
      Maps each ERCOT weather zone (EIA sub-balancing authority code) to the city or cities whose
      weather represents it. South Central uses the average of Austin and San Antonio.
    config:
      column_types:
        zone_code: varchar
        zone_label: varchar
        weather_city: varchar
    columns:
      - name: zone_code
        data_tests: [not_null]
      - name: weather_city
        data_tests: [unique, not_null]

  - name: ercot_series
    description: The hourly EIA series loaded for ERCOT, with plain-English names.
    config:
      column_types:
        series_code: varchar
    columns:
      - name: series_code
        data_tests: [unique, not_null]

  - name: ercot_fuel_types
    description: EIA fuel type codes with plain-English names and groups (fossil, nuclear, renewable, storage).
    config:
      column_types:
        fuel_code: varchar
        is_renewable: boolean
        is_carbon_free: boolean
    columns:
      - name: fuel_code
        data_tests: [unique, not_null]
      - name: fuel_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['Fossil', 'Nuclear', 'Renewable', 'Storage', 'Other']

  - name: us_holidays
    description: >
      US federal holidays (actual and observed dates) plus holiday-adjacent days when Texas demand also drops.
      Generated by `python -m src.holidays_seed` from calendar rules; is_nerc_holiday marks the six grid off-peak holidays.
    config:
      column_types:
        holiday_date: date
        is_nerc_holiday: boolean
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]
      - name: holiday_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Federal', 'Federal (observed)', 'Holiday-adjacent']
