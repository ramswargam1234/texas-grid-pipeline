# Runs on every push and pull request: unit tests + a full dbt build on a synthetic data lake.
# Needs no secrets or network access to the data APIs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build synthetic data lake
        run: python -m src.sample_data

      - name: dbt build (models, snapshots, unit + data tests)
        run: python -m src.run_dbt
