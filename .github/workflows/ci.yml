# Runs on every push and pull request: unit tests + a full dbt build on a synthetic data lake.
# Needs no secrets or network access to the data APIs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      # The same one-command demo a new user runs: synthetic lake -> dbt build (all tests) -> report -> export.
      - name: Demo pipeline on synthetic data
        run: python -m src.demo
