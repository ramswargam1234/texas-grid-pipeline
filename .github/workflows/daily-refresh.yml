# Runs every morning in the cloud: pulls the data lake from S3, loads the newest grid and weather
# data, syncs back to S3, rebuilds dbt, and commits a fresh dashboard snapshot. Streamlit Cloud
# redeploys automatically when the snapshot commit lands on main.
#
# Repository secrets required (Settings > Secrets and variables > Actions):
#   EIA_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
name: Daily refresh

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC = 8:17 AM CDT / 7:17 AM CST
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed to commit the refreshed snapshot

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      S3_BUCKET: texas-grid-pipeline-ram
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data lake from S3
        run: python -m src.storage.s3_sync --download

      - name: Load latest grid data (EIA)
        run: python -m src.ingestion.eia_demand --days 7

      - name: Load latest zone demand (EIA)
        run: python -m src.ingestion.eia_zones --days 7

      - name: Load latest fuel mix (EIA)
        run: python -m src.ingestion.eia_fuel --days 7

      - name: Load latest weather (Open-Meteo)
        run: python -m src.ingestion.weather --days 14

      - name: Load latest day-ahead weather forecasts (Open-Meteo Previous Runs)
        run: python -m src.ingestion.weather_forecast --days 10

      - name: Push new and changed files to S3
        run: python -m src.storage.s3_sync

      - name: Restore warehouse (snapshot history) from S3
        run: python -m src.storage.s3_sync --state-download

      - name: dbt build (models, snapshots, unit + data tests)
        run: python -m src.run_dbt

      - name: Demand forecast (backtest new and recent months)
        run: python -m src.forecast

      - name: Push forecast files to S3
        run: python -m src.storage.s3_sync

      - name: dbt build, forecast stage (model vs ERCOT forecast)
        run: python -m src.run_dbt --stage forecast

      - name: Check data freshness (results go on the dashboard; the last step fails if a source is stale)
        run: python -m src.freshness check

      - name: Save warehouse to S3
        run: python -m src.storage.s3_sync --state-upload

      - name: Headline findings
        run: python -m src.report

      - name: Export dashboard snapshot
        run: python -m src.export_dashboard

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/snapshot
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Daily refresh: dashboard snapshot $(date -u +%F)"
          # Someone may have pushed while this job ran; replay the snapshot commit on top of it.
          git pull --rebase origin main
          git push

      # Runs last so a stale source never blocks the dashboard refresh, but still turns the run red,
      # which makes GitHub email the repo owner.
      - name: Fail if a data source stopped delivering
        run: python -m src.freshness gate
